name: Frontend pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

# A new push to a PR cancels its previous run. Runs on main never cancel each
# other: each one gets its own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

# Shared setup (pnpm, Node.js, dependencies) lives in .github/actions/setup.
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      # The github-actions reporter adds a results table to the run summary.
      - name: Run unit tests with coverage
        run: pnpm test:ci --reporter=github-actions

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: reports/junit.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      # Checks that the app builds. Deploys build again per environment,
      # because Vite bakes the VITE_* variables into the files.
      - name: Build
        run: pnpm build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist

  # Deploys only run on pushes to main: pull requests stop after Test and Build.
  # The deploy-site action builds for the environment, uploads to Pages and
  # checks that the site serves the new build.
  deploy-dev:
    name: Deploy to Development
    needs: [test, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: Development
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Deploy to Development
        id: deploy
        uses: ./.github/actions/deploy-site
        with:
          mode: dev
          project: quickdish-frontend-dev
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Waits for a reviewer to approve the Production environment.
  deploy-prod:
    name: Deploy to Production
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Deploy to Production
        id: deploy
        uses: ./.github/actions/deploy-site
        with:
          mode: prod
          project: quickdish-frontend-prod
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
